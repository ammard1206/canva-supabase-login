<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: #111;
    }

    .container {
      width: 350px;
      padding: 35px;
      background: white;
      border-radius: 15px;
      text-align: center;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 8px;
    }

    button {
      padding: 12px 20px;
      margin: 10px 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Welcome</h1>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <br>

    <button id="signupBtn">Sign Up</button>
    <button id="signinBtn">Sign In</button>

    <p id="message"></p>

  </div>


  <script>

    const SUPABASE_URL = "https://qukrqrctteolxpumdwzc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_GzVsfrFNDFvg14_6SbWqTA_Q2iipeVe";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


    // SIGN UP
    document.getElementById("signupBtn").addEventListener("click", async function () {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.textContent = "Please enter your email and password.";
        return;
      }

      message.textContent = "Creating account...";

      const { data, error } = await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent =
        "Sign Up successful! Check your email for verification.";

    });


    // SIGN IN
    document.getElementById("signinBtn").addEventListener("click", async function () {

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const message = document.getElementById("message");

      if (!email || !password) {
        message.textContent = "Please enter your email and password.";
        return;
      }

      message.textContent = "Signing in...";

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        message.textContent = error.message;
        return;
      }

      message.textContent = "Sign In successful! Welcome!";

    });

  </script>

</body>
</html>
